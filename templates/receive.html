{% extends 'base.html' %}
{% block content %}
<h2>Receive Stock</h2>
<form method="post" style="display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:8px;">
  <label>Product
    <select name="product_id" required>
      {% for p in products %}
        <option value="{{ p['id'] }}">{{ p['name'] }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Quantity<input type="number" name="quantity" min="1" value="1" required></label>
  <label>Expiry date<input type="date" name="expiry_date" required></label>
  <label>Supplier name<input name="supplier_name"></label>
  <label>Lot number<input name="lot_number"></label>
  <label>Unit cost<input type="number" step="0.01" name="unit_cost"></label>
  <button type="submit">Receive</button>
</form>
{% endblock %}
